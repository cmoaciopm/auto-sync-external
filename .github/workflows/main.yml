name: Sync from External Git

on:
  #schedule:
  #  - cron: '*/5 * * * *'  # 每5分钟执行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Add external remote and fetch
        run: |
          git init
          git remote add external https://gonganmin:${{secrets.CP_PASSWORD}}@codeup.aliyun.com/6824742594317fd8828bbb48/oversea/backend.git
          git fetch external

      - name: Merge and push
        run: |
          git config user.name "Github Actions"
          git config user.email "gonganmin@songmont.cn"

          git checkout main
          git push main
